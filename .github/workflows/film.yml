name: VanThara film
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test photo/video/voice sources only | draft = render, nothing posted | post = render and publish to YouTube + Instagram"
        default: check

permissions:
  contents: write

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt edge-tts
      - name: Film
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            post) python film.py --post ;;
            ig) python film.py --ig-existing ;;
            draft) python film.py ;;
            *) python film.py --check ;;
          esac
      - uses: actions/upload-artifact@v4
        if: github.event.inputs.mode == 'draft' || github.event.inputs.mode == 'post'
        with:
          name: vanthara-film
          path: out/film-*.mp4
